<script>
/* Persisted simulation state. No hardware or network access. */
(() => {
  'use strict';
  const ns = globalThis.CCEW ||= {};
  const STORAGE_KEY = 'ccew-companion-ui-v1'; // Retain the key to migrate earlier prototypes.
  const clone = value => JSON.parse(JSON.stringify(value));
  const blankHaptic = () => ({ status: 'not-requested', commandId: null, requestedAt: null, sentAt: null, confirmedAt: null, deadline: null, attempts: 0, reason: '' });
  const audioState = (now, ready = false) => ({
    status: ready ? 'ready' : 'capturing', captureReadyAt: now + 20000,
    preSeconds: 20, postSeconds: 20, durationSeconds: 40, totalChunks: 8,
    receivedChunks: ready ? [0,1,2,3,4,5,6,7] : [], nextChunkAt: null,
    completedAt: ready ? now + 24000 : null
  });
  function freshState(now) {
    const telemetry = { battery: 84, charging: false, worn: true, rawWorn: true,
      contactCandidateAt: null, briefRestoreAt: null,
      components: { motion: 'ok', contact: 'ok', audio: 'ok', haptic: 'ok' } };
    const contacts = [
      { id: 'jordan', name: 'Jordan Lee', role: 'Team supervisor', phone: '(555) 010-0248', email: 'jordan@example.com' },
      { id: 'taylor', name: 'Taylor Brooks', role: 'Safety representative', phone: '(555) 010-0163', email: 'taylor@example.com' }
    ];
    const events = [0,1].map(index => {
      const detectedAt = now - (index ? 86400000 : 3600000);
      return { id: `sample-${index ? 'fall' : 'check'}`, type: index ? 'fall' : 'test', source: 'wearable',
        detectedAt, receivedAt: detectedAt + 1000, deliveredAt: detectedAt + 2000,
        acknowledgedAt: detectedAt + 60000, responder: clone(contacts[index]),
        recipients: clone(contacts), transfer: { status: 'received', dueAt: null, attempts: 1 },
        delivery: { status: 'delivered', dueAt: null, attempts: 1, reason: '' },
        haptic: { ...blankHaptic(), status: 'successful', commandId: `sample-haptic-${index}`,
          requestedAt: detectedAt + 60000, sentAt: detectedAt + 61000, confirmedAt: detectedAt + 62000, attempts: 1 },
        audio: audioState(detectedAt, true) };
    });
    return { version: 2, sequence: 0,
      profile: { name: 'Alex Morgan', role: 'Community responder', organization: 'Community response team' },
      settings: { disconnectNotice: true, contactNotice: true, reducedMotion: false, hapticPattern: 'Two short pulses' },
      contacts, events, device: { connection: 'connected', transitionDue: null, lastSync: now, lastKnownFall: null,
        telemetry, lastKnown: clone(telemetry) },
      simulation: { deliveryFailure: false }, fall: null, fallHistory: [] };
  }
  function migrate(saved, now) {
    const base = freshState(now);
    if (!saved || ![1,2].includes(saved.version) || !Array.isArray(saved.contacts) || !Array.isArray(saved.events)) return base;
    base.contacts = saved.contacts.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string');
    base.profile = { ...base.profile, ...saved.profile };
    base.settings = { ...base.settings, ...saved.settings };
    if (saved.version === 2) {
      base.sequence = Number(saved.sequence) || 0;
      base.device = { ...base.device, ...saved.device,
        telemetry: { ...base.device.telemetry, ...saved.device?.telemetry,
          components: { ...base.device.telemetry.components, ...saved.device?.telemetry?.components } },
        lastKnown: { ...base.device.lastKnown, ...saved.device?.lastKnown,
          components: { ...base.device.lastKnown.components, ...saved.device?.lastKnown?.components } } };
      if (!['connected','connecting','syncing','disconnected'].includes(base.device.connection)) base.device.connection = 'disconnected';
      // A new browser session cannot assume an in-flight transport command completed.
      if (['connecting','syncing'].includes(base.device.connection)) { base.device.connection = 'disconnected'; base.device.transitionDue = null; }
      base.simulation = { ...base.simulation, ...saved.simulation };
      base.fall = saved.fall ? { ...saved.fall, interrupted: true } : null;
      base.fallHistory = Array.isArray(saved.fallHistory) ? saved.fallHistory : [];
      base.events = saved.events.filter(e => e && typeof e.id === 'string' && e.transfer && e.delivery && e.audio && e.haptic).map(clone);
      for (const event of base.events) {
        if (event.transfer.status === 'transferring') { event.transfer.status = 'queued'; event.transfer.dueAt = null; }
        if (event.audio.status === 'transferring') { event.audio.status = 'paused'; event.audio.nextChunkAt = null; }
        if (event.haptic.status === 'sent') { event.haptic.status = 'pending'; event.haptic.deadline = null; }
        event.audio.receivedChunks = [...new Set(event.audio.receivedChunks)].filter(n => Number.isInteger(n) && n >= 0 && n < event.audio.totalChunks);
      }
    } else {
      const telemetry = base.device.telemetry;
      for (const key of ['battery','worn','charging']) if (saved[key] !== undefined) telemetry[key] = saved[key];
      telemetry.rawWorn = telemetry.worn;
      base.device.lastKnown = clone(telemetry);
      base.device.connection = saved.connected ? 'connected' : 'disconnected';
      base.device.lastSync = saved.lastSync || now;
      base.fall = saved.fallDue ? { id: 'legacy-fall', startedAt: saved.fallDue - 10000,
        dueAt: saved.fallDue, repeats: 0, phoneVisible: !!saved.connected, interrupted: true } : null;
      base.events = [...saved.events, ...(saved.deviceOutbox || [])].filter(e => e && typeof e.id === 'string').map(e => {
        const receivedAt = e.received || (saved.events.includes(e) ? e.created : null);
        const acknowledgedAt = e.acknowledged || null;
        return { id: e.id, type: e.type, source: 'wearable', detectedAt: e.created,
          receivedAt, deliveredAt: acknowledgedAt ? receivedAt : null, acknowledgedAt,
          responder: acknowledgedAt ? { id: 'legacy-contact', name: e.ackBy || 'Demo contact' } : null,
          recipients: clone(base.contacts),
          transfer: { status: receivedAt ? 'received' : 'queued', dueAt: null, attempts: 0 },
          delivery: { status: acknowledgedAt ? 'delivered' : receivedAt ? 'pending' : 'not-sent', dueAt: receivedAt && !acknowledgedAt ? now + 800 : null, attempts: 0, reason: '' },
          // Legacy replies did not prove that the motor completed a command.
          haptic: { ...blankHaptic(), ...(acknowledgedAt ? { status: 'pending', commandId: `${e.id}:haptic`, requestedAt: acknowledgedAt, reason: 'Awaiting explicit wearable confirmation after upgrade.' } : {}) },
          audio: { ...audioState(e.created, !!e.audioSynced), captureReadyAt: e.audioReadyAt || e.created + 20000 } };
      });
    }
    base.events = [...new Map(base.events.map(e => [e.id, e])).values()];
    return base;
  }
  class Store {
    constructor({ storage, now = () => Date.now() } = {}) {
      this.storage = storage; this.now = now; this.revision = 0; this.storageFailed = false;
      let saved;
      try { saved = JSON.parse(storage?.getItem(STORAGE_KEY) || 'null'); } catch { this.storageFailed = true; }
      this.state = migrate(saved, this.now());
      this.save();
    }
    save() {
      this.revision++;
      try { this.storage?.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch { this.storageFailed = true; }
    }
    id(prefix) { this.state.sequence++; return `${prefix}-${this.now().toString(36)}-${this.state.sequence}-${globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)}`; }
    reset() { this.state = freshState(this.now()); this.save(); }
  }
  Object.assign(ns, { Store, blankHaptic, audioState, clone });
})();

;
/* Mock transport contract. Replace this adapter when the BLE protocol is defined. */
(() => {
  'use strict';
  class BleService {
    constructor(store, { protocol = {} } = {}) { this.store = store; this.protocol = protocol; this.listeners = new Map(); }
    on(type, listener) {
      if (!this.listeners.has(type)) this.listeners.set(type, new Set());
      this.listeners.get(type).add(listener);
      return () => this.listeners.get(type)?.delete(listener);
    }
    emit(type, payload) { this.listeners.get(type)?.forEach(listener => listener(payload)); }
    isReady() { return this.store.state.device.connection === 'connected'; }
    connect() {
      const device = this.store.state.device;
      if (device.connection !== 'disconnected') return false;
      device.connection = 'connecting'; device.transitionDue = this.store.now() + 750;
      this.store.save(); this.emit('connection', 'connecting'); return true;
    }
    disconnect() {
      const device = this.store.state.device;
      if (this.isReady()) device.lastKnownFall = globalThis.CCEW.clone(this.store.state.fall);
      device.connection = 'disconnected'; device.transitionDue = null;
      this.store.save(); this.emit('disconnect'); this.emit('connection', 'disconnected');
    }
    tick() {
      const device = this.store.state.device;
      if (device.transitionDue === null || this.store.now() < device.transitionDue) return;
      if (device.connection === 'connecting') {
        device.connection = 'syncing'; device.transitionDue = this.store.now() + 750;
      } else if (device.connection === 'syncing') {
        device.connection = 'connected'; device.transitionDue = null;
        device.lastSync = this.store.now(); device.lastKnown = globalThis.CCEW.clone(device.telemetry);
        device.lastKnownFall = globalThis.CCEW.clone(this.store.state.fall);
        this.emit('connect');
      }
      this.store.save(); this.emit('connection', device.connection);
    }
    send(command) {
      if (!this.isReady()) return false;
      this.emit('command', command);
      return true; // Transport acceptance is not a device completion acknowledgement.
    }
    receive(packet) { if (this.isReady()) this.emit('event', packet); }
  }
  globalThis.CCEW.BleService = BleService;
})();

;
(() => {
  'use strict';
  const ns = globalThis.CCEW;
  class DeviceService {
    constructor(store, ble) { this.store = store; this.ble = ble; }
    getStatus() {
      const d = this.store.state.device;
      return { ...ns.clone(this.ble.isReady() ? d.telemetry : d.lastKnown),
        connection: d.connection, current: this.ble.isReady(), lastSync: d.lastSync };
    }
    updateTelemetry(patch) {
      const d = this.store.state.device;
      d.telemetry = { ...d.telemetry, ...patch, components: { ...d.telemetry.components, ...patch.components } };
      if (this.ble.isReady()) { d.lastKnown = ns.clone(d.telemetry); d.lastSync = this.store.now(); }
      this.store.save();
      this.ble.emit('telemetry', this.getStatus());
    }
    visibleFall() {
      if (this.ble.isReady()) return this.store.state.fall;
      const known = this.store.state.device.lastKnownFall;
      return known && known.dueAt > this.store.now() ? known : null;
    }
    readiness({ transferring = false } = {}) {
      const d = this.getStatus();
      const result = (status, badge, heading, description) => ({ status, badge, heading, description });
      if (this.visibleFall()) return result('urgent','FALL CHECK-IN','Are you okay?',
        d.current ? 'A possible fall was detected. Use “I’m okay” to cancel this check-in.' : 'The last received fall check-in is still active. Reconnect to send your cancellation to the wearable.');
      if (d.connection === 'connecting') return result('connecting','CONNECTING','Connecting your wearable.', 'Establishing the simulated Bluetooth link. Sensor readings remain last known.');
      if (d.connection === 'syncing') return result('syncing','SYNCING','Getting back in sync.', 'Restoring the connection and refreshing device readings.');
      if (!d.current) return result('disconnected','CONNECTION LOST','Let’s get you reconnected.', 'Device readings are last known. Events on the wearable will transfer after reconnection.');
      if (d.components.contact !== 'ok' || !d.worn) return result('warning','SKIN CONTACT LOST','Check your wearable.', d.components.contact !== 'ok' ? 'The simulated skin-contact sensor is unavailable. Run a device check.' : 'Skin contact is not detected. Adjust the strap against your wrist.');
      if (d.contactCandidateAt !== null) return result('warning','CHECKING CONTACT','Checking your wearable.', 'Waiting for a stable skin-contact reading before creating a removal alert.');
      if (d.battery <= 20) return result('warning','LOW BATTERY','Time to recharge.', `The simulated battery is at ${d.battery}%. ${d.charging ? 'Keep USB-C connected while it charges.' : 'Connect a USB-C charger.'}`);
      if (Object.values(d.components).some(value => value !== 'ok')) return result('warning','DEVICE CHECK NEEDED','Check your wearable.', 'A simulated component has failed. Open My device for individual results.');
      if (transferring) return result('syncing','SYNCING EVENTS','Getting back in sync.', 'Queued wearable events are transferring to the phone.');
      return result('normal','WEARABLE CONNECTED','Ready when you need it.', 'Your simulated connection, battery, skin contact, and component checks pass.');
    }
    check() {
      const d = this.getStatus();
      const check = (id, label, ok, detail) => ({ id, label, status: !d.current && id !== 'bluetooth' ? 'unknown' : ok ? 'passed' : 'failed', detail: !d.current && id !== 'bluetooth' ? 'Unknown until reconnection' : detail });
      return [
        check('bluetooth','Bluetooth',d.current,d.current ? 'Connected' : d.connection),
        check('battery','Battery',d.battery > 20,`${d.battery}% simulated charge`),
        check('contact','Skin contact',d.components.contact === 'ok' && d.worn && d.contactCandidateAt === null,d.components.contact !== 'ok' ? 'Sensor unavailable' : d.contactCandidateAt !== null ? 'Checking stability' : d.worn ? 'Contact detected' : 'Contact lost'),
        check('motion','Motion sensor',d.components.motion === 'ok',d.components.motion === 'ok' ? 'Simulated sensor responds' : 'Simulated sensor failed'),
        check('audio','Audio sensor',d.components.audio === 'ok',d.components.audio === 'ok' ? 'Synthetic buffer available' : 'Simulated sensor failed'),
        check('haptic','Haptic component',d.components.haptic === 'ok',d.components.haptic === 'ok' ? 'Component available; command completion needs confirmation' : 'Simulated motor failed')
      ];
    }
  }
  ns.DeviceService = DeviceService;
})();

;
(() => {
  'use strict';
  const ns = globalThis.CCEW;
  class AlertService {
    constructor(store, ble) {
      this.store = store; this.ble = ble;
      ble.on('disconnect', () => this.pause());
      ble.on('event', packet => this.detect(packet.type, { id: packet.id, detectedAt: packet.detectedAt }));
    }
    get(id) { return this.store.state.events.find(e => e.id === id); }
    visible() { return this.store.state.events.filter(e => e.receivedAt !== null).sort((a,b) => b.detectedAt - a.detectedAt); }
    queued() { return this.store.state.events.filter(e => e.receivedAt === null); }
    detect(type = 'manual', { id, source = 'wearable', detectedAt = this.store.now() } = {}) {
      if (!['manual','fall','removal','test'].includes(type) || !['phone','wearable'].includes(source)) return null;
      if (source === 'phone' && !this.ble.isReady()) return null;
      if (id && this.get(id)) return this.get(id);
      const event = { id: id || this.store.id('event'), type, source, detectedAt,

document.addEventListener('click', async event => {

    case 'wearable-cancel-fall': demo.cancelFall({ fromPhone:false }); render(); syncModal(); break;

document.addEventListener('submit', event => {
  if (!['profile-form','contact-form'].includes(event.target.id)) return;
  event.preventDefault(); const data = new FormData(event.target);
  const value = name => String(data.get(name) || '').trim();
  if (event.target.id === 'profile-form') {
    if (!value('name') || !value('role')) return;
    store.state.profile = { name:value('name'), role:value('role'), organization:value('organization') }; store.save(); afterAction('Profile saved in this browser.');
  } else {
    if (!value('name') || !value('role') || value('phone').replace(/\D/g,'').length < 7) { toast('Enter a name, role, and a phone number with at least seven digits.',true); return; }
    const oldId = event.target.dataset.id;
    const contact = { id:oldId || store.id('contact'), name:value('name'), role:value('role'), phone:value('phone'), email:value('email') };
    if (oldId) store.state.contacts = store.state.contacts.map(c => c.id === oldId ? contact : c); else store.state.contacts.push(contact);
    store.save(); closeModal(); afterAction('Safety contact saved.');
  }
});
document.addEventListener('change', event => {
  switch (event.target.id) {
    case 'status-filter': statusFilter = event.target.value; render(); break;
    case 'type-filter': typeFilter = event.target.value; render(); break;
    case 'haptic-pattern': store.state.settings.hapticPattern = event.target.value; store.save(); break;
    case 'delete-confirm': modal.querySelector('[data-action="confirm-delete"]').disabled = !event.target.checked; break;
  }
});
document.addEventListener('input', event => {
  if (event.target.id === 'audio-seek' && audio.player) { audio.player.currentTime = Number(event.target.value); syncModal(); }
});
document.addEventListener('keydown', event => {
  if (event.key.toLowerCase() === 'd' && !event.ctrlKey && !event.metaKey && !event.altKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && !modal.open) { event.preventDefault(); demoModal(); }
});
function tick() {
  const before = store.revision;
  const previousDevice = device.getStatus();
  ble.tick(); demo.tick(); alerts.tick(); audio.tick(); haptics.tick();
  if (store.revision !== before) needsRender = true;
  const nextLabel = greeting() + new Date().toDateString();
  if (clockLabel !== nextLabel) { clockLabel = nextLabel; needsRender = true; }
  const nextDevice = device.getStatus();
  if (previousDevice.current && previousDevice.worn && nextDevice.current && !nextDevice.worn && store.state.settings.contactNotice) toast('Skin contact lost after a stable reading. A simulated removal event was recorded.');
  // Preserve text inputs and native selects during background simulator updates.
  const editing = document.querySelector('#main').contains(document.activeElement) && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if (needsRender && !editing) render();
  document.querySelectorAll('[data-fall-count]').forEach(el => { const fall = device.visibleFall(); if (fall) el.textContent = Math.max(0,Math.ceil((fall.dueAt-store.now())/1000)); });
  syncModal();
}
app.render = render; app.navTo = navTo; app.tick = tick; app.greeting = greeting;
setInterval(tick,250);
window.addEventListener('beforeunload', () => audio.dispose());
hydrateIcons(); tick(); render();
if (store.storageFailed || !browserStorage) toast('Browser storage is unavailable. Changes last for this session only.',true);

</script>
</body>
</html>
